name: Deploy to GitHub Pages

# 备用站点：把 dist 发布到 GitHub Pages。
# 数据走 Supabase（VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY），
# AI 走 Supabase Edge Function（见 supabase/functions/ai-recommend）。
# 需要在仓库 Settings → Secrets and variables → Actions 里配置这两个 Secret。

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # GitHub Pages 项目站固定为 /<repo>/；若改用 <user>.github.io 仓库，改成 /
          VITE_BASE: /${{ github.event.repository.name }}/
          # anon key 本身会打进前端 JS（公开信息），用 Variables 即可；也兼容 Secrets
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: SPA fallback (404.html)
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
